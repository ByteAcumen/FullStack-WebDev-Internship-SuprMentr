<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Network Grid Pattern -->
  <g opacity="0.2">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#60a5fa" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="800" height="600" fill="url(#grid)" />
  </g>
  
  <!-- Central Shield -->
  <g transform="translate(400,300)">
    <!-- Glow Effect -->
    <circle r="120" fill="url(#glowEffect)"/>
    
    <!-- Main Shield -->
    <path d="M-50,-70 L50,-70 L50,0 C50,40 20,70 0,80 C-20,70 -50,40 -50,0 Z" 
          fill="url(#shieldGradient)" stroke="#60a5fa" stroke-width="2"/>
    
    <!-- Shield Inner Pattern -->
    <path d="M-30,-50 L30,-50 L30,-10 C30,20 10,40 0,50 C-10,40 -30,20 -30,-10 Z" 
          fill="none" stroke="#93c5fd" stroke-width="1.5"/>
    
    <!-- Lock Icon in Shield -->
    <g transform="translate(0,-15)">
      <rect x="-8" y="0" width="16" height="20" rx="2" fill="#93c5fd"/>
      <path d="M-5,-8 C-5,-12 -2,-15 0,-15 C2,-15 5,-12 5,-8 L5,2 L-5,2 Z" 
            fill="none" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="0" cy="8" r="2" fill="#1e40af"/>
    </g>
  </g>
  
  <!-- Floating Data Nodes -->
  <g opacity="0.6">
    <!-- Node 1 -->
    <g transform="translate(150,150)">
      <circle r="8" fill="#60a5fa" opacity="0.8"/>
      <circle r="3" fill="#93c5fd"/>
    </g>
    
    <!-- Node 2 -->
    <g transform="translate(650,180)">
      <circle r="6" fill="#60a5fa" opacity="0.8"/>
      <circle r="2" fill="#93c5fd"/>
    </g>
    
    <!-- Node 3 -->
    <g transform="translate(200,450)">
      <circle r="7" fill="#60a5fa" opacity="0.8"/>
      <circle r="3" fill="#93c5fd"/>
    </g>
    
    <!-- Node 4 -->
    <g transform="translate(600,420)">
      <circle r="5" fill="#60a5fa" opacity="0.8"/>
      <circle r="2" fill="#93c5fd"/>
    </g>
  </g>
  
  <!-- Connection Lines -->
  <g opacity="0.3">
    <line x1="150" y1="150" x2="400" y2="230" stroke="#60a5fa" stroke-width="1"/>
    <line x1="650" y1="180" x2="400" y2="230" stroke="#60a5fa" stroke-width="1"/>
    <line x1="200" y1="450" x2="400" y2="370" stroke="#60a5fa" stroke-width="1"/>
    <line x1="600" y1="420" x2="400" y2="370" stroke="#60a5fa" stroke-width="1"/>
  </g>
  
  <!-- Binary Code Rain Effect -->
  <g opacity="0.15" fill="#60a5fa" font-family="monospace" font-size="12">
    <text x="100" y="50">1010101</text>
    <text x="300" y="80">1100110</text>
    <text x="500" y="60">0101010</text>
    <text x="700" y="90">1011010</text>
    <text x="50" y="200">1110001</text>
    <text x="750" y="250">0011100</text>
    <text x="80" y="350">1001101</text>
    <text x="680" y="380">0110101</text>
    <text x="120" y="500">1101001</text>
    <text x="600" y="520">0101110</text>
  </g>
  
  <!-- Cyber Hexagons -->
  <g opacity="0.4" stroke="#60a5fa" stroke-width="1" fill="none">
    <polygon points="100,100 120,110 120,130 100,140 80,130 80,110" transform="rotate(15 100 120)"/>
    <polygon points="700,300 720,310 720,330 700,340 680,330 680,310" transform="rotate(-20 700 320)"/>
    <polygon points="150,500 170,510 170,530 150,540 130,530 130,510" transform="rotate(30 150 520)"/>
  </g>
</svg>
